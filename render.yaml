# Render Blueprint for ExamSensei Backend (Supabase Postgres, no Docker)
# https://render.com/docs/blueprint-spec

services:
  # FastAPI backend — Render native Python runtime
  - type: web
    name: examsensei-api
    runtime: python
    region: singapore           # closest to India
    plan: free                  # 'starter' ($7/mo) for always-on
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_v2:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.7
      # DATABASE_URL points at Supabase. Set manually in the Render dashboard
      # to the Supabase connection string (with ?sslmode=require). The
      # transaction-mode pooler URL (port 6543) is recommended for small apps.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel + custom-domain origins
      - key: LOG_LEVEL
        value: INFO
      # Optional Ollama URL (leave blank to fall back to canned responses)
      - key: OLLAMA_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
