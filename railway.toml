# Railway Configuration for ExamSensei Backend
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Start command
startCommand = "cd backend && uvicorn app_v2:app --host 0.0.0.0 --port $PORT"

# Health check
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Number of instances
numReplicas = 1
