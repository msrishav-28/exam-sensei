name: Refresh exam data

# Runs Sundays at 04:00 UTC (09:30 IST) and on manual demand.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      # Never run two refreshes at once — would duplicate writes.
      group: refresh-exam-data
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-scraper.txt

      - name: Install scraper dependencies
        run: pip install -r backend/requirements-scraper.txt

      - name: Install Playwright (Chromium)
        # Crawl4AI uses Playwright for JS-heavy pages.
        run: |
          python -m playwright install --with-deps chromium

      - name: Refresh exam data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/scripts/refresh_exam_data.py
