# ExamSensei — exam source registry.
#
# Each entry is a single exam that the refresh pipeline tries to keep current.
# `pages` is a map of section → URL. The pipeline fetches each page, cleans
# it (Crawl4AI for HTML, Jina Reader for PDFs auto-detected by extension),
# then asks Gemini to extract structured Exam + Topic data matching the
# Pydantic schema in refresh_exam_data.py.
#
# Idempotent: rows are upserted by `code`. Re-running the pipeline overwrites
# only the fields the LLM produced — manual edits to other fields survive.

